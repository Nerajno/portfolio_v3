[build]
  command = "astro build --remote"
  publish = "dist"

[build.environment]
  NPM_VERSION = "10.9.2"
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[dev]
  framework = "#custom"
  command = "astro dev"
  port = 3000
  targetPort = 3000



# #488: temporary "site upgrade in progress" banner while the redesign (#316) is in progress.
# Set to "false" (or remove) when the redesign merges.
[context.production.environment]
  PUBLIC_SHOW_UPGRADE_BANNER = "true"
