[build]
  command = "astro build"
  publish = "dist"

[build.environment]
  NPM_VERSION = "9.8.1"
  # NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  node_bundler = "esbuild"

[dev]
  framework = "#custom"
  command = "astro dev"
  port = 3000
  targetPort = 3000


